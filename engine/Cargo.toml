[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
hound = "3.5.1"
nnnoiseless = { version = "0.5.2", default-features = false }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
realfft = "3.5.1"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
